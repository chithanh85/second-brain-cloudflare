name = "second-brain"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# AUTH_TOKEN must be set as a secret after deployment:
# wrangler secret put AUTH_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "second-brain-db"
database_id = "7360255f-5f50-4801-8a11-57aff3820729"

[[vectorize]]
binding = "VECTORIZE"
index_name = "second-brain-vectors"
# Using bge-m3 multilingual model (1024 dimensions) instead of bge-small-en (384)
# Manually: wrangler vectorize create second-brain-vectors --dimensions=1024 --metric=cosine

[ai]
binding = "AI"
